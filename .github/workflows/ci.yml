name: Flow AI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flow-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLOW_OFFICE_PROVIDER: mock
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python3 -m pip install -r ../backend/requirements.txt
      - name: Check FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            python3 -m pip install imageio-ffmpeg==0.6.0
            ffmpeg_bin="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            echo "FLOW_FFMPEG_BIN=$ffmpeg_bin" >> "$GITHUB_ENV"
            "$ffmpeg_bin" -version
          else
            ffmpeg -version
          fi
      - name: Backend orchestration and media tests
        run: PYTHONPATH=../backend python3 -m unittest discover -s ../backend/tests
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build -- --webpack
      - name: Check runner Chrome
        run: google-chrome --version
      - name: Browser and Python API tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_BUILD: '1'
          PLAYWRIGHT_CHANNEL: chrome
